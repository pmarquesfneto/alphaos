/* 1. MARKET PRICES via Yahoo Finance + CORS proxy fallback */
async function fetchPrices(){
  const MAP={'CL=F':{l:'WTI',u:'$/bbl'},'BZ=F':{l:'BRENT',u:'$/bbl'},'GC=F':{l:'GOLD',u:'$/oz'},'HG=F':{l:'COPPER',u:'$/lb'},'ZC=F':{l:'CORN',u:'\u00a2/bu'},'ZS=F':{l:'SOYBEANS',u:'\u00a2/bu'},'ZW=F':{l:'WHEAT',u:'\u00a2/bu'},'KC=F':{l:'COFFEE',u:'\u00a2/lb'},'CC=F':{l:'COCOA',u:'$/mt'},'SB=F':{l:'SUGAR',u:'\u00a2/lb'},'CT=F':{l:'COTTON',u:'\u00a2/lb'},'NG=F':{l:'NAT GAS',u:'$/mmb'},'^GSPC':{l:'S&P 500',u:''},'EURUSD=X':{l:'EUR/USD',u:''},'^VIX':{l:'VIX',u:''},'^TNX':{l:'10Y UST',u:'%'},'DX-Y.NYB':{l:'DXY',u:''}};
  const syms=Object.keys(MAP).join(',');
  const YF_URL='https://query1.finance.yahoo.com/v7/finance/quote?formatted=true&symbols='+syms+'&fields=regularMarketPrice,regularMarketChange,regularMarketChangePercent';
  const PROXIES=[
    'https://corsproxy.io/?'+encodeURIComponent(YF_URL),
    'https://api.allorigins.win/raw?url='+encodeURIComponent(YF_URL),
  ];
  for(const url of PROXIES){
    try{
      const r=await fetch(url,{headers:{Accept:'application/json'}});
      if(!r.ok)continue;
      const d=await r.json();
      const quotes=d.quoteResponse?.result||[];
      if(!quotes.length)continue;
      const data={};
      quotes.forEach(q=>{const m=MAP[q.symbol];if(m&&q.regularMarketPrice?.raw!=null)data[m.l]={price:q.regularMarketPrice.raw,chg:q.regularMarketChange?.raw,pct:q.regularMarketChangePercent?.raw,unit:m.u};});
      if(Object.keys(data).length>5)return{status:'live',src:'Yahoo Finance',data};
    }catch(e){}
  }
  return{status:'needs_key',src:'Yahoo Finance — CORS blocked',data:{},note:'Connect Polygon.io ($29/mo) for direct live prices'};
}

/* 2. US TREASURY YIELDS — free, no key */
async function fetchYields(){
  try{
    const yr=new Date().getFullYear();
    const r=await fetch('https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/'+yr+'/all?type=daily_treasury_yield_curve&field_tdrv_date_value_year='+yr+'&download=true');
    if(!r.ok)throw new Error(r.status);
    const csv=await r.text();const lines=csv.trim().split('\n').filter(l=>l.trim());
    if(lines.length<2)throw new Error('no data');
    const hdrs=lines[0].split(',').map(h=>h.replace(/"/g,'').trim());
    const last=lines[lines.length-1].split(',').map(v=>v.replace(/"/g,'').trim());
    const row={};hdrs.forEach((h,i)=>{row[h]=last[i];});
    const g=(...ks)=>{for(const k of ks){const v=parseFloat(row[k]);if(!isNaN(v))return v;}return null;};
    return{status:'live',src:'US Treasury',date:row['Date']||last[0],
      '1M':g('1 Mo'),'3M':g('3 Mo'),'6M':g('6 Mo'),'1Y':g('1 Yr'),
      '2Y':g('2 Yr'),'5Y':g('5 Yr'),'10Y':g('10 Yr'),'20Y':g('20 Yr'),'30Y':g('30 Yr')};
  }catch(e){return{status:'error',src:'US Treasury',error:e.message};}
}

/* 3. CFTC COT with real 52-week percentile */
async function fetchCOTMarket(label,query){
  try{
    const w=encodeURIComponent("market_and_exchange_names like '%"+query+"%'");
    const r=await fetch('https://publicreporting.cftc.gov/api/id/6dca-aqww.json?$limit=52&$order=report_date_as_yyyy_mm_dd+DESC&$where='+w);
    if(!r.ok)throw new Error(r.status);
    const data=await r.json();if(!data||!data.length)throw new Error('no data');
    const rows=data.map(rec=>{const lng=parseInt(rec.noncomm_positions_long_all||0),sht=parseInt(rec.noncomm_positions_short_all||0);return{net:lng-sht,lng,sht,oi:parseInt(rec.open_interest_all||0),chgL:parseInt(rec.change_in_noncomm_long_all||0),chgS:parseInt(rec.change_in_noncomm_short_all||0),date:rec.report_date_as_yyyy_mm_dd};});
    const cur=rows[0];const allN=rows.map(n=>n.net);const mn=Math.min(...allN),mx=Math.max(...allN),rng=mx-mn||1;
    return{label,net:cur.net,lng:cur.lng,sht:cur.sht,oi:cur.oi,chg:cur.chgL-cur.chgS,date:cur.date,pct:Math.round(((cur.net-mn)/rng)*100),min52:mn,max52:mx,weeks:rows.length,live:true,history:rows.slice(0,26).reverse()};
  }catch(e){return{label,net:0,pct:50,live:false,error:e.message};}
}
async function fetchCOT(){
  const mkts=[{l:'CORN',q:'CORN - CHICAGO BOARD'},{l:'SOYBEANS',q:'SOYBEANS - CHICAGO BOARD'},{l:'WHEAT',q:'WHEAT-SRW'},{l:'COTTON',q:'COTTON NO. 2'},{l:'COFFEE',q:'COFFEE C'},{l:'SUGAR',q:'SUGAR NO. 11'},{l:'WTI',q:'CRUDE OIL, LIGHT SWEET'},{l:'GOLD',q:'GOLD - COMMODITY EXCHANGE'},{l:'NAT GAS',q:'NATURAL GAS - NEW YORK'}];
  const results=[];for(const m of mkts){results.push(await fetchCOTMarket(m.l,m.q));await new Promise(r=>setTimeout(r,150));}
  return results;
}

/* 5. ENSO / ONI Index — NOAA CPC via CORS proxy */
async function fetchENSO(){
  const URLS=[
    'https://corsproxy.io/?'+encodeURIComponent('https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt'),
    'https://api.allorigins.win/raw?url='+encodeURIComponent('https://origin.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt'),
  ];
  for(const url of URLS){
    try{
      const r=await fetch(url);if(!r.ok)continue;
      const text=await r.text();
      const lines=text.trim().split('\n').filter(l=>{const t=l.trim();return t&&!t.startsWith('SEAS')&&!t.startsWith('YR')&&!/^[A-Z\s]+$/.test(t);});
      if(!lines.length)continue;
      const parse=l=>{const p=l.trim().split(/\s+/);return{seas:p[0],yr:parseInt(p[1]),anom:parseFloat(p[3])};};
      const recent=lines.slice(-4).map(parse).filter(d=>!isNaN(d.anom));
      if(!recent.length)continue;
      const lat=recent[recent.length-1];
      const phase=lat.anom>=0.5?'EL NINO':lat.anom<=-0.5?'LA NINA':'NEUTRAL';
      const trend=recent.length>1?(lat.anom>recent[recent.length-2].anom?'+':'-'):'→';
      const implication=phase==='LA NINA'?'Brazil/SEA drought risk elevated · Corn & Soy watch':phase==='EL NINO'?'MENA + Australia dry risk · Wheat & Sugar watch':'Normal seasonal pattern · Monitor transition';
      return{status:'live',oni:lat.anom,phase,trend,seas:lat.seas,yr:lat.yr,recent:recent.slice(-3),implication,src:'NOAA CPC'};
    }catch(e){}
  }
  return{status:'error',oni:null,phase:'UNKNOWN',src:'NOAA CPC'};
}

/* 9. FRED — key-gated */
async function fetchFRED(key){
  if(!key)return null;
  const series=[{id:'FEDFUNDS',l:'Fed Funds'},{id:'CPIAUCSL',l:'CPI YoY',yoy:true},{id:'UNRATE',l:'Unemployment'},{id:'DGS2',l:'2Y Yield'},{id:'DGS10',l:'10Y Yield'},{id:'T10Y2Y',l:'2s10s Spread'},{id:'T10YIE',l:'10Y Breakeven'},{id:'BAMLH0A0HYM2',l:'HY Spread'}];
  const out=[];
  for(const s of series){
    try{
      const fredUrl='https://api.stlouisfed.org/fred/series/observations?series_id='+s.id+'&api_key='+key+'&file_type=json&sort_order=desc&limit='+(s.yoy?14:8);
      const urls=[fredUrl,'https://corsproxy.io/?'+encodeURIComponent(fredUrl)];
      let d=null;
      for(const url of urls){try{const r=await fetch(url);if(!r.ok)continue;d=await r.json();if(d.observations)break;}catch(e){}}
      if(!d)continue;
      const obs=(d.observations||[]).filter(o=>o.value!=='.');
      if(obs[0]){const rawVal=parseFloat(obs[0].value);const val=s.yoy&&obs[12]?((rawVal/parseFloat(obs[12].value))-1)*100:rawVal;const prevRaw=parseFloat(obs[1]?.value||obs[0].value);const prev=s.yoy&&obs[13]?((prevRaw/parseFloat(obs[13].value))-1)*100:prevRaw;out.push({id:s.id,label:s.l,value:Math.round(val*100)/100,prev:Math.round(prev*100)/100,date:obs[0].date,hist:obs.slice(0,s.yoy?13:8).map((o,i,a)=>s.yoy&&a[i+12]?Math.round(((parseFloat(o.value)/parseFloat(a[i+12].value))-1)*10000)/100:parseFloat(o.value)).filter((_,i,a)=>!s.yoy||i<a.length-12).reverse()});}
    }catch(e){}
  }
  return out.length?{status:'live',src:'FRED',data:out}:null;
}

/* 12. USDA PSD — Production, Supply & Distribution
   VERIFIED: api.fas.usda.gov/api/psd/commodity/{code}/country/all/year/{yr}?api_key=KEY
   World = sum all countries (no dedicated world aggregate row) */
/* PSD commodity codes + correct units (USDA PSD standard)
   Correct attribute IDs verified from live API:
   20=BegStocks 28=Production 57=Imports 86=TotalSupply 88=Exports 125=DomCons 176=EndingStocks */
const PSD_CROPS={
  CORN:     {code:'0440000',unit:'1000 MT',  du:'MMT',     div:1000},
  SOYBEANS: {code:'2222000',unit:'1000 MT',  du:'MMT',     div:1000},
  WHEAT:    {code:'0410000',unit:'1000 MT',  du:'MMT',     div:1000},
  COTTON:   {code:'2631000',unit:'1000 480-lb Bales',du:'K Bales',div:1},
  COFFEE:   {code:'0711100',unit:'1000 Bags',du:'M Bags',  div:1000},
  SUGAR:    {code:'0611200',unit:'1000 MT',  du:'MMT',     div:1000},
  COCOA:    {code:'0721200',unit:'1000 MT',  du:'MMT',     div:1000},
  'PALM OIL':{code:'4243000',unit:'1000 MT', du:'MMT',     div:1000}
};

async function fetchPSDYear(key,crop,year){
  const meta=PSD_CROPS[crop];if(!meta)return null;
  const base='https://api.fas.usda.gov/api/psd/commodity/'+meta.code+'/country/all/year/'+year+'?api_key='+key;
  for(const url of [base,'https://corsproxy.io/?'+encodeURIComponent(base)]){
    try{
      const r=await fetch(url,{headers:{Accept:'application/json'}});
      if(!r.ok)continue;
      const rows=await r.json();
      if(!Array.isArray(rows)||!rows.length)continue;
      const sum=id=>rows.filter(d=>d.attributeId===id).reduce((s,d)=>s+parseFloat(d.value||0),0);
      const usVal=id=>{const x=rows.find(d=>d.countryCode==='US'&&d.attributeId===id);return x?parseFloat(x.value):null;};
      const wBeg=sum(20),wProd=sum(28),wImp=sum(57),wTot=sum(86),wExp=sum(88),wDom=sum(125),wEnd=sum(176);
      const wSU=wDom>0?Math.round((wEnd/wDom)*1000)/10:null;
      const usDom=usVal(125),usEnd=usVal(176);
      const usSU=usDom>0&&usEnd!=null?Math.round((usEnd/usDom)*1000)/10:null;
      const topProd=rows.filter(d=>d.attributeId===28&&parseFloat(d.value)>0)
        .sort((a,b)=>parseFloat(b.value)-parseFloat(a.value)).slice(0,8)
        .map(d=>({cc:d.countryCode,val:parseFloat(d.value)}));
      return{year,
        world:{begStocks:Math.round(wBeg),production:Math.round(wProd),imports:Math.round(wImp),
               totalSupply:Math.round(wTot),exports:Math.round(wExp),domConsumption:Math.round(wDom),
               endingStocks:Math.round(wEnd),stocksToUse:wSU},
        us:{begStocks:usVal(20),production:usVal(28),imports:usVal(57),
            exports:usVal(88),domConsumption:usDom,endingStocks:usEnd,stocksToUse:usSU},
        topProducers:topProd};
    }catch(e){}
  }
  return null;
}

async function fetchPSDCrop(key,crop){
  if(!key)return null;
  const meta=PSD_CROPS[crop];if(!meta)return null;
  const yr=new Date().getFullYear();
  for(const year of [yr,yr-1]){
    const d=await fetchPSDYear(key,crop,year);
    if(d)return{status:'live',src:'USDA PSD',crop,year,unit:meta.unit,displayUnit:meta.du,divisor:meta.div,...d};
  }
  return null;
}

async function fetchPSDMulti(key){
  if(!key)return null;
  const results={};
  for(const crop of Object.keys(PSD_CROPS)){
    try{const d=await fetchPSDCrop(key,crop);if(d)results[crop]=d;}catch(e){}
    await new Promise(r=>setTimeout(r,150));
  }
  return Object.keys(results).length?{status:'live',src:'USDA PSD',data:results}:null;
}

async function fetchPSDHistory(key,crop){
  if(!key)return null;
  const yr=new Date().getFullYear();
  const hist=[];
  for(const y of [yr-4,yr-3,yr-2,yr-1,yr]){
    try{const d=await fetchPSDYear(key,crop,y);if(d)hist.push(d);}catch(e){}
    await new Promise(r=>setTimeout(r,100));
  }
  return hist;
}

/* 14. USDA AMS (MARS) — Market News
   VERIFIED: corsproxy.io + Basic auth + 7-day date filter required
   Slug 2850 = Iowa Daily Cash Grain Bids (CONFIRMED WORKING) */
async function fetchAMS(key){
  if(!key)return null;
  const authHdr='Basic '+btoa(key+':');
  const today=new Date(),weekAgo=new Date(Date.now()-7*86400000);
  const fmt=d=>`${d.getMonth()+1}/${d.getDate()}/${d.getFullYear()}`;
  const dateRange=`${fmt(weekAgo)}:${fmt(today)}`;
  const SLUGS=[
    {id:'2850',name:'Iowa Cash Grain',type:'grain'},
    {id:'1280',name:'OK Feeder Cattle',type:'livestock'},
    {id:'1655',name:'National Rice',type:'grain'}
  ];
  const results={};
  for(const rep of SLUGS){
    try{
      // AMS is CORS-blocked — must use corsproxy
      const target=`https://marsapi.ams.usda.gov/services/v1.2/reports/${rep.id}?q=report_begin_date=${dateRange}&allSections=true`;
      const url=`https://corsproxy.io/?${encodeURIComponent(target)}`;
      const r=await fetch(url,{headers:{Accept:'application/json',Authorization:authHdr}});
      if(!r.ok)continue;
      const d=await r.json();
      // Response is array of sections: [{reportSection, results:[...]}, ...]
      const sections=Array.isArray(d)?d:[d];
      const allRows=sections.flatMap(s=>Array.isArray(s.results)?s.results:[]);
      const narrative=allRows.find(r=>r.report_narrative)?.report_narrative||null;
      if(allRows.length||narrative)
        results[rep.name]={type:rep.type,id:rep.id,rows:allRows.slice(0,8),narrative,date:allRows[0]?.report_date||null};
      await new Promise(r=>setTimeout(r,250));
    }catch(e){}
  }
  return Object.keys(results).length?{status:'live',src:'USDA AMS',data:results}:null;
}

function buildCtx(st){
  const {prices,yields,cot,noaa,gdelt,fred,eia,usda,hawk,geo,enso,psd,esr,ams}=st;
  const P=prices?.data||{},Y=yields||{};
  const ps=Object.entries(P).slice(0,10).map(([k,v])=>k+':'+fmt(v.price)+'('+fmtPct(v.pct)+')').join(' ');
  const cs=(cot||[]).filter(c=>c.live).map(c=>c.label+' '+c.pct+'th%ile '+fmtK(c.net)).join(' ');
  const hs=Object.entries(hawk?.scores||{}).map(([k,v])=>k+'='+v.score+'('+v.change+')').join(' ');
  const fs=(fred?.data||[]).map(s=>s.label+':'+fmt(s.value)+'%').join(' ');
  const gs=(geo||[]).map(g=>g.r+':conflict='+g.ci).join(' ');
  const yStr=Y['2Y']&&Y['10Y']?'US2Y:'+fmt(Y['2Y'],2)+'% 10Y:'+fmt(Y['10Y'],2)+'% spread:'+fmt((Y['10Y']-Y['2Y'])*100,0)+'bp':'';
  const ensoStr=enso?.status==='live'?'ONI:'+enso.oni+' '+enso.phase+' ('+enso.implication+')':'';
  // PSD S&D summary
  const psdStr=psd?.data?Object.entries(psd.data).slice(0,4).map(([crop,d])=>{
    const w=d.world;
    return w?crop+':prod='+fmt(w.production,0)+' endStk='+fmt(w.endingStocks,0)+' S/U='+w.stocksToUse+'%':'';
  }).filter(Boolean).join(' '):'';
  // ESR export pace
  const esrStr=esr?.data?Object.entries(esr.data).slice(0,3).map(([crop,d])=>
    crop+':wklyNet='+fmtK(d.weeklyNet*1000)+' accumulated='+fmtK(d.accumulated*1000)
  ).join(' '):'';
  return 'You are AlphaQuery — institutional hedge fund AI. Date: '+new Date().toDateString()+'.\n\nLIVE PRICES ('+prices?.src+'): '+(ps||'OFFLINE')+
    '\nLIVE COT (CFTC 52w real percentiles): '+(cs||'loading')+
    '\nLIVE YIELDS (US Treasury): '+(yStr||'loading')+
    '\nLIVE CB HAWKISHNESS (Claude NLP): '+(hs||'loading')+
    (ensoStr?'\nLIVE ENSO (NOAA CPC): '+ensoStr:'')+
    (psdStr?'\nUSDA PSD S&D (world, current yr): '+psdStr:'')+
    (esrStr?'\nUSDA ESR EXPORT PACE (weekly): '+esrStr:'')+
    (fs?'\nFRED MACRO: '+fs:'\nFRED: key not configured')+
    (eia?'\nEIA CRUDE: '+fmt(eia.latest/1000,1)+'Mb ('+fmtK(eia.chg*1000)+' WoW)':'')+
    (usda?'\nUSDA NASS CORN G/E: '+usda.data[0]?.value?.toFixed(0)+'%':'')+
    '\nGDELT GEO RISK: '+(gs||'loading')+
    '\n\nOnly cite data present above. Be concise (4-6 sentences), data-driven, action-oriented. No disclaimers.';
}

function LineChart({data=[],color=C.accent,w=340,h=80,labels=[],title='',unit='',yFmt=null}){
  const CE=React.createElement;
  const vals=data.map(Number).filter(v=>!isNaN(v));
  if(vals.length<2)return CE('div',{style:{height:h,display:'flex',alignItems:'center',justifyContent:'center',color:C.muted,fontSize:7}},'INSUFFICIENT DATA');
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
  const PAD={l:labels.length?36:8,r:8,t:title?16:4,b:labels.length?18:8};
  const plotW=w-PAD.l-PAD.r,plotH=h-PAD.t-PAD.b;
  const xP=i=>PAD.l+(i/(vals.length-1))*plotW;
  const yP=v=>PAD.t+plotH-((v-mn)/rng)*plotH;
  const pts=vals.map((v,i)=>`${xP(i)},${yP(v)}`).join(' ');
  const last=vals[vals.length-1],prev=vals[vals.length-2];
  const lc=last>=prev?C.green:C.red;
  const fmt=yFmt||(v=>Math.abs(v)>=1000?Math.round(v/1000)+'K':v.toFixed(1));
  const yTicks=3;
  // Show every Nth label to avoid crowding
  const lStep=Math.max(1,Math.ceil(labels.length/5));
  return CE('svg',{width:w,height:h,style:{display:'block',overflow:'visible'}},
    CE('defs',null,CE('linearGradient',{id:'lcg'+w+h,x1:'0',y1:'0',x2:'0',y2:'1'},
      CE('stop',{offset:'0%',stopColor:lc,stopOpacity:0.15}),
      CE('stop',{offset:'100%',stopColor:lc,stopOpacity:0}))),
    // Title
    title&&CE('text',{x:PAD.l,y:10,fontSize:6,fill:C.muted,fontFamily:'IBM Plex Mono,monospace',letterSpacing:'1px'},title),
    // Y grid lines + labels
    ...Array.from({length:yTicks+1},(_,i)=>{
      const v=mn+(rng/yTicks)*i;
      const y=yP(v);
      return CE('g',{key:'yg'+i},
        CE('line',{x1:PAD.l,y1:y,x2:w-PAD.r,y2:y,stroke:C.border,strokeWidth:0.5,strokeDasharray:'2,3'}),
        CE('text',{x:PAD.l-3,y:y+3,textAnchor:'end',fontSize:6,fill:C.muted,fontFamily:'IBM Plex Mono,monospace'},fmt(v))
      );
    }),
    // X labels (every Nth)
    ...labels.filter((_,i)=>i===0||i===labels.length-1||i%lStep===0).map((lb,_,arr)=>{
      const i=labels.indexOf(lb);
      return CE('text',{key:'xl'+i,x:xP(i),y:h-2,textAnchor:i===0?'start':i===labels.length-1?'end':'middle',fontSize:6,fill:C.muted,fontFamily:'IBM Plex Mono,monospace'},lb);
    }),
    // Area fill
    CE('polygon',{points:pts+` ${xP(vals.length-1)},${h-PAD.b} ${xP(0)},${h-PAD.b}`,fill:`url(#lcg${w}${h})`}),
    // Line
    CE('polyline',{points:pts,fill:'none',stroke:lc,strokeWidth:1.5,strokeLinejoin:'round'}),
    // Data points for small datasets
    vals.length<=12&&vals.map((v,i)=>CE('circle',{key:i,cx:xP(i),cy:yP(v),r:2.5,fill:lc})),
    // Last value dot
    CE('circle',{cx:xP(vals.length-1),cy:yP(last),r:3.5,fill:lc}),
    // Current value label
    CE('text',{x:xP(vals.length-1)+5,y:yP(last)+3,fontSize:7,fill:lc,fontFamily:'IBM Plex Mono,monospace',fontWeight:'bold'},fmt(last)+(unit?' '+unit:''))
  );
}

/* ═══════════════════════════════════════════════════════
   PSD WORKBENCH — Interactive S&D Analysis Tool
   ═══════════════════════════════════════════════════════ */
const PSD_COUNTRIES={
  'WORLD (Sum)':'ALL','US':'US','China':'CH','Brazil':'BR','EU':'E4',
  'Argentina':'AR','Australia':'AS','Canada':'CA','India':'IB','Ukraine':'UP',
  'Russia':'RS','Mexico':'MX','Thailand':'TH','Vietnam':'VM','Indonesia':'ID',
  'Malaysia':'MY','Pakistan':'PK','Bangladesh':'BG'
};
const PSD_ATTR_MAP={
  20:{n:'Beg. Stocks',short:'BEG'},
  28:{n:'Production',short:'PROD'},
  57:{n:'Imports',short:'IMP'},
  86:{n:'Total Supply',short:'TSUP'},
  88:{n:'Exports',short:'EXP'},
  125:{n:'Dom. Consumption',short:'DOM'},
  176:{n:'Ending Stocks',short:'ESTK'},
  195:{n:'Stocks/Use %',short:'S/U%',derived:true}
};
const PSD_CROP_YEARS=[2018,2019,2020,2021,2022,2023,2024,2025];
const PSD_COUNTRY_NAMES=Object.fromEntries(Object.entries(PSD_COUNTRIES).map(([k,v])=>[v,k]));

function PSDWorkbench({psd,psdKey,fetchPSDYear,fetchPSDHistory}){
  const CE=React.createElement;
  const [selectedCrops,setSelectedCrops]=useState(['CORN','SOYBEANS','WHEAT']);
  const [selectedAttrs,setSelectedAttrs]=useState([28,176,88,125,195]);
  const [selectedYears,setSelectedYears]=useState([2022,2023,2024,2025]);
  const [selectedCountry,setSelectedCountry]=useState('ALL');
  const [viewMode,setViewMode]=useState('table'); // table | chart
  const [chartAttr,setChartAttr]=useState(195); // which attr to chart
  const [chartType,setChartType]=useState('line'); // line | bar
  const [tableData,setTableData]=useState({});
  const [loading,setLoading]=useState({});
  const [colMode,setColMode]=useState('years'); // years | crops | countries

  const fmt3=v=>v!=null&&!isNaN(v)?parseFloat(v).toFixed(3):'—';
  const fmtVal=(v,attrId,div)=>{
    if(v==null||isNaN(v))return '—';
    if(attrId===195)return parseFloat(v).toFixed(1)+'%';
    // Values in API are 1000 MT or 1000 Bales — show raw with 3 decimals as requested
    return parseFloat(v).toFixed(3);
  };

  const cropMeta=React.useMemo(()=>{
    const m={};
    Object.entries(PSD_CROPS).forEach(([k,v])=>{ m[k]=v; });
    return m;
  },[]);

  // Fetch data for selected crops/years/country
  const fetchData=React.useCallback(async()=>{
    if(!psdKey)return;
    const needed=[];
    selectedCrops.forEach(crop=>{
      selectedYears.forEach(year=>{
        const key=`${crop}_${year}`;
        if(!tableData[key])needed.push({crop,year,key});
      });
    });
    if(!needed.length)return;
    setLoading(prev=>{
      const n={...prev};
      needed.forEach(({key})=>{n[key]=true;});
      return n;
    });
    for(const {crop,year,key} of needed){
      try{
        const d=await fetchPSDYear(psdKey,crop,year);
        setTableData(prev=>({...prev,[key]:d||null}));
      }catch(e){}
      setLoading(prev=>{const n={...prev};delete n[key];return n;});
    }
  },[psdKey,selectedCrops,selectedYears,tableData,fetchPSDYear]);

  useEffect(()=>{fetchData();},[selectedCrops,selectedYears]);

  // Extract value for a given crop/year/attr/country
  const getValue=(crop,year,attrId,countryCode)=>{
    const d=tableData[`${crop}_${year}`];
    if(!d)return null;
    if(attrId===195){
      // Derived: EndStk / DomCons * 100
      const endStk=getValue(crop,year,176,countryCode);
      const domCons=getValue(crop,year,125,countryCode);
      return endStk!=null&&domCons!=null&&domCons>0?(endStk/domCons)*100:null;
    }
    if(countryCode==='ALL'){
      // Sum all countries
      return d.world?.[{20:'begStocks',28:'production',57:'imports',86:'totalSupply',88:'exports',125:'domConsumption',176:'endingStocks'}[attrId]]??null;
    }
    if(countryCode==='US') return d.us?.[{20:'begStocks',28:'production',57:'imports',86:'totalSupply',88:'exports',125:'domConsumption',176:'endingStocks'}[attrId]]??null;
    return null; // Other countries need raw row data — future enhancement
  };

  const toggleCrop=c=>setSelectedCrops(p=>p.includes(c)?p.filter(x=>x!==c):[...p,c]);
  const toggleAttr=a=>setSelectedAttrs(p=>p.includes(a)?p.filter(x=>x!==a):[...p,a]);
  const toggleYear=y=>setSelectedYears(p=>p.includes(y)?p.filter(x=>x!==y).sort((a,b)=>a-b):[...p,y].sort((a,b)=>a-b));

  const suColor=v=>v==null?C.muted:v<10?C.red:v<15?C.red:v<20?C.gold:C.green;
  const changeColor=(curr,prev)=>curr==null||prev==null?C.muted:curr>prev?C.green:curr<prev?C.red:C.muted;

  // Build chart data
  const chartData=React.useMemo(()=>{
    return selectedCrops.map(crop=>{
      const vals=selectedYears.map(year=>getValue(crop,year,chartAttr,selectedCountry));
      return{crop,vals,color:{CORN:C.gold,SOYBEANS:C.green,WHEAT:C.accent,COTTON:C.rose,COFFEE:'#8b4513',SUGAR:'#c0c0c0',COCOA:'#5c4033','PALM OIL':'#ff8c00'}[crop]||C.accent};
    });
  },[tableData,selectedCrops,selectedYears,chartAttr,selectedCountry]);

  const hasData=selectedCrops.some(c=>selectedYears.some(y=>tableData[`${c}_${y}`]));
  const isLoading=Object.keys(loading).length>0;

  // SVG Line Chart
  const renderChart=()=>{
    const W=800,H=280,PAD={l:70,r:20,t:30,b:50};
    const plotW=W-PAD.l-PAD.r,plotH=H-PAD.t-PAD.b;
    const allVals=chartData.flatMap(d=>d.vals).filter(v=>v!=null);
    if(!allVals.length)return CE('div',{style:{height:H,display:'flex',alignItems:'center',justifyContent:'center',color:C.muted,fontSize:8}},'No data to chart');
    const mn=Math.min(...allVals)*0.95,mx=Math.max(...allVals)*1.05,rng=mx-mn||1;
    const xStep=plotW/(selectedYears.length-1||1);
    const yPos=v=>PAD.t+plotH-(v-mn)/rng*plotH;
    const xPos=i=>PAD.l+i*xStep;
    const yTicks=5;
    const isPC=chartAttr===195;

    return CE('svg',{width:'100%',viewBox:`0 0 ${W} ${H}`,style:{display:'block',overflow:'visible'}},
      // Grid
      Array.from({length:yTicks+1},(_,i)=>{
        const v=mn+(rng/yTicks)*i;
        const y=yPos(v);
        return CE('g',{key:'g'+i},
          CE('line',{x1:PAD.l,y1:y,x2:W-PAD.r,y2:y,stroke:C.border,strokeWidth:1,strokeDasharray:'3,3'}),
          CE('text',{x:PAD.l-6,y:y+3,textAnchor:'end',fontSize:8,fill:C.muted,fontFamily:'IBM Plex Mono,monospace'},
            isPC?v.toFixed(1)+'%':v.toFixed(0))
        );
      }),
      // X axis labels
      selectedYears.map((yr,i)=>
        CE('text',{key:'x'+i,x:xPos(i),y:H-PAD.b+16,textAnchor:'middle',fontSize:8,fill:C.muted,fontFamily:'IBM Plex Mono,monospace'},'MY'+yr)
      ),
      // X axis line
      CE('line',{x1:PAD.l,y1:H-PAD.b,x2:W-PAD.r,y2:H-PAD.b,stroke:C.border,strokeWidth:1}),
      // Y axis line
      CE('line',{x1:PAD.l,y1:PAD.t,x2:PAD.l,y2:H-PAD.b,stroke:C.border,strokeWidth:1}),
      // Y axis label
      CE('text',{x:12,y:H/2,textAnchor:'middle',fontSize:7,fill:C.muted,fontFamily:'IBM Plex Mono,monospace',transform:`rotate(-90,12,${H/2})`},
        isPC?'Stocks/Use %':(PSD_CROPS[selectedCrops[0]]?.unit||'1000 MT')),
      // Data series
      chartData.map(({crop,vals,color})=>{
        const pts=vals.map((v,i)=>v!=null?[xPos(i),yPos(v)]:null).filter(Boolean);
        if(pts.length<1)return null;
        if(chartType==='line'){
          const validSegs=[];
          let seg=[];
          vals.forEach((v,i)=>{
            if(v!=null)seg.push([xPos(i),yPos(v)]);
            else if(seg.length){validSegs.push(seg);seg=[];}
          });
          if(seg.length)validSegs.push(seg);
          return CE('g',{key:crop},
            validSegs.map((s,si)=>
              CE('polyline',{key:si,points:s.map(p=>p.join(',')).join(' '),fill:'none',stroke:color,strokeWidth:2,strokeLinejoin:'round'})
            ),
            pts.map((p,pi)=>CE('circle',{key:pi,cx:p[0],cy:p[1],r:3,fill:color})),
            pts.map((p,pi)=>{
              const v=vals.filter(v=>v!=null)[pi];
              return CE('text',{key:'l'+pi,x:p[0],y:p[1]-7,textAnchor:'middle',fontSize:7,fill:color,fontFamily:'IBM Plex Mono,monospace'},
                isPC?v.toFixed(1)+'%':v.toFixed(0));
            })
          );
        }
        // Bar chart
        const bw=Math.min(30,xStep*0.7/selectedCrops.length);
        const offset=(selectedCrops.indexOf(crop)-selectedCrops.length/2+0.5)*bw;
        return CE('g',{key:crop},
          vals.map((v,i)=>{
            if(v==null)return null;
            const bh=(v-mn)/rng*plotH;
            const x=xPos(i)+offset-bw/2;
            const y=yPos(v);
            return CE('g',{key:i},
              CE('rect',{x,y,width:bw,height:bh,fill:color,opacity:0.8}),
              CE('text',{x:x+bw/2,y:y-3,textAnchor:'middle',fontSize:6,fill:color,fontFamily:'IBM Plex Mono,monospace'},isPC?v.toFixed(1)+'%':v.toFixed(0))
            );
          })
        );
      }),
      // Legend
      chartData.map(({crop,color},i)=>
        CE('g',{key:'leg'+i,transform:`translate(${PAD.l+i*90},${H-12})`},
          CE('rect',{x:0,y:-5,width:8,height:8,fill:color}),
          CE('text',{x:11,y:2,fontSize:7,fill:C.text,fontFamily:'IBM Plex Mono,monospace'},crop)
        )
      )
    );
  };

  return CE('div',{style:{padding:14,overflowY:'auto',flex:1,fontFamily:'IBM Plex Mono,monospace'}},
    // Header
    CE('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,borderBottom:'1px solid '+C.border,paddingBottom:10}},
      CE('div',null,
        CE('div',{style:{fontSize:8,letterSpacing:'3px',color:psd?.status==='live'?C.green:C.gold}},'USDA PSD WORKBENCH'+(isLoading?' · LOADING…':'')),
        CE('div',{style:{fontSize:6,color:C.muted,marginTop:3}},'Production, Supply & Distribution · api.fas.usda.gov · All values in native API unit (1000 MT or 1000 Bales) · 3 decimal precision')
      ),
      CE('div',{style:{display:'flex',gap:6}},
        ['table','chart'].map(v=>CE('button',{key:v,onClick:()=>setViewMode(v),style:{fontSize:7,padding:'4px 12px',cursor:'pointer',background:v===viewMode?C.accent+'20':'transparent',border:'1px solid '+(v===viewMode?C.accent:C.border),color:v===viewMode?C.accent:C.muted,fontFamily:'IBM Plex Mono,monospace',letterSpacing:'1px'}},v==='table'?'TABLE':'CHART'))
      )
    ),

    // Controls row
    CE('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:12,marginBottom:12}},

      // Crops selector
      CE('div',null,
        CE('div',{style:{fontSize:6,color:C.muted,letterSpacing:'1px',marginBottom:6}},'CROPS'),
        CE('div',{style:{display:'flex',flexWrap:'wrap',gap:4}},
          Object.keys(PSD_CROPS).map(c=>CE('button',{key:c,onClick:()=>toggleCrop(c),style:{fontSize:7,padding:'2px 8px',cursor:'pointer',background:selectedCrops.includes(c)?C.gold+'25':'transparent',border:'1px solid '+(selectedCrops.includes(c)?C.gold:C.border),color:selectedCrops.includes(c)?C.gold:C.muted,fontFamily:'IBM Plex Mono,monospace'}},c))
        )
      ),

      // Attributes selector
      CE('div',null,
        CE('div',{style:{fontSize:6,color:C.muted,letterSpacing:'1px',marginBottom:6}},'ATTRIBUTES'),
        CE('div',{style:{display:'flex',flexDirection:'column',gap:3}},
          Object.entries(PSD_ATTR_MAP).map(([id,{n,short}])=>CE('label',{key:id,style:{display:'flex',alignItems:'center',gap:6,cursor:'pointer'}},
            CE('input',{type:'checkbox',checked:selectedAttrs.includes(parseInt(id)),onChange:()=>toggleAttr(parseInt(id)),style:{accentColor:C.accent,cursor:'pointer'}}),
            CE('span',{style:{fontSize:7,color:selectedAttrs.includes(parseInt(id))?C.hi:C.muted}},n)
          ))
        )
      ),

      // Year range selector
      CE('div',null,
        CE('div',{style:{fontSize:6,color:C.muted,letterSpacing:'1px',marginBottom:6}},'MARKET YEARS'),
        CE('div',{style:{display:'flex',flexWrap:'wrap',gap:4}},
          PSD_CROP_YEARS.map(y=>CE('button',{key:y,onClick:()=>toggleYear(y),style:{fontSize:7,padding:'2px 8px',cursor:'pointer',background:selectedYears.includes(y)?C.accent+'25':'transparent',border:'1px solid '+(selectedYears.includes(y)?C.accent:C.border),color:selectedYears.includes(y)?C.accent:C.muted,fontFamily:'IBM Plex Mono,monospace'}},y))
        )
      ),

      // Country + chart controls
      CE('div',null,
        CE('div',{style:{fontSize:6,color:C.muted,letterSpacing:'1px',marginBottom:6}},'GEOGRAPHY'),
        CE('select',{value:selectedCountry,onChange:e=>setSelectedCountry(e.target.value),style:{fontSize:7,background:C.s2,color:C.hi,border:'1px solid '+C.border,padding:'4px 8px',fontFamily:'IBM Plex Mono,monospace',width:'100%',marginBottom:8}},
          Object.entries(PSD_COUNTRIES).map(([label,code])=>CE('option',{key:code,value:code},label))
        ),
        viewMode==='chart'&&CE('div',null,
          CE('div',{style:{fontSize:6,color:C.muted,letterSpacing:'1px',marginBottom:4}},'CHART ATTRIBUTE'),
          CE('select',{value:chartAttr,onChange:e=>setChartAttr(parseInt(e.target.value)),style:{fontSize:7,background:C.s2,color:C.hi,border:'1px solid '+C.border,padding:'4px 8px',fontFamily:'IBM Plex Mono,monospace',width:'100%',marginBottom:6}},
            Object.entries(PSD_ATTR_MAP).map(([id,{n}])=>CE('option',{key:id,value:id},n))
          ),
          CE('div',{style:{display:'flex',gap:4}},
            ['line','bar'].map(t=>CE('button',{key:t,onClick:()=>setChartType(t),style:{fontSize:7,padding:'3px 10px',cursor:'pointer',flex:1,background:t===chartType?C.accent+'20':'transparent',border:'1px solid '+(t===chartType?C.accent:C.border),color:t===chartType?C.accent:C.muted,fontFamily:'IBM Plex Mono,monospace'}},t.toUpperCase()))
          )
        )
      )
    ),

    // No key state
    !psdKey&&CE('div',{style:{padding:24,textAlign:'center',border:'1px solid '+C.border,background:C.s1,marginBottom:12}},
      CE('div',{style:{fontSize:8,color:C.gold,marginBottom:6}},'USDA PSD KEY REQUIRED'),
      CE('div',{style:{fontSize:7,color:C.muted}},'Add your free PSD API key in ⚙ Settings → USDA PSD'),
      CE('a',{href:'https://apps.fas.usda.gov/opendataweb/',target:'_blank',style:{fontSize:7,color:C.accent,marginTop:4,display:'block'}},'→ Register free at apps.fas.usda.gov/opendataweb')
    ),

    // TABLE VIEW
    viewMode==='table'&&CE('div',{style:{overflowX:'auto'}},
      CE('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:7,fontFamily:'IBM Plex Mono,monospace'}},
        CE('thead',null,
          CE('tr',null,
            CE('th',{style:{padding:'6px 8px',textAlign:'left',borderBottom:'2px solid '+C.accent,fontSize:6,letterSpacing:'1px',color:C.muted,background:C.s1,position:'sticky',left:0,zIndex:2,minWidth:140}},'CROP · ATTRIBUTE'),
            selectedCrops.length>0&&selectedYears.map(yr=>
              CE('th',{key:yr,style:{padding:'6px 10px',textAlign:'right',borderBottom:'2px solid '+C.accent,fontSize:7,color:C.accent,background:C.s1,fontWeight:600,minWidth:90}},'MY'+yr)
            ),
            // YoY change columns
            selectedYears.length>1&&CE('th',{style:{padding:'6px 10px',textAlign:'right',borderBottom:'2px solid '+C.accent,fontSize:6,color:C.muted,background:C.s1,minWidth:70}},'YoY Δ')
          )
        ),
        CE('tbody',null,
          selectedCrops.flatMap(crop=>[
            // Crop header row
            CE('tr',{key:crop+'_hdr',style:{background:C.s2}},
              CE('td',{colSpan:selectedYears.length+2,style:{padding:'5px 8px',fontSize:7,color:C.gold,letterSpacing:'2px',fontWeight:600,borderBottom:'1px solid '+C.border}},
                crop+' · '+PSD_CROPS[crop]?.unit+' · '+(selectedCountry==='ALL'?'WORLD':PSD_COUNTRY_NAMES[selectedCountry]||selectedCountry))
            ),
            // Attribute rows
            ...selectedAttrs.map(attrId=>{
              const {n,short}=PSD_ATTR_MAP[attrId]||{n:String(attrId),short:String(attrId)};
              const vals=selectedYears.map(yr=>getValue(crop,yr,attrId,selectedCountry));
              const lastVal=vals[vals.length-1];
              const prevVal=vals[vals.length-2];
              const yoy=lastVal!=null&&prevVal!=null?lastVal-prevVal:null;
              const isKey=attrId===195||attrId===176||attrId===28;
              const colFn=attrId===195?v=>suColor(v):()=>C.hi;
              return CE('tr',{key:crop+'_'+attrId,style:{borderBottom:'1px solid '+C.border+'60'},onMouseEnter:e=>e.currentTarget.style.background=C.s2,onMouseLeave:e=>e.currentTarget.style.background='transparent'},
                CE('td',{style:{padding:'4px 8px',color:isKey?C.hi:C.text,position:'sticky',left:0,background:'inherit',borderRight:'1px solid '+C.border,fontWeight:isKey?600:400}},
                  CE('span',{style:{fontSize:6,color:C.muted,marginRight:4}},short),n
                ),
                vals.map((v,yi)=>CE('td',{key:yi,style:{padding:'4px 10px',textAlign:'right',color:isKey&&attrId!==195?colFn(v):attrId===195?suColor(v):C.text,fontWeight:isKey?600:400,fontVariantNumeric:'tabular-nums'}},
                  loading[`${crop}_${selectedYears[yi]}`]?CE('div',{style:{animation:'shimmer 1.5s infinite',width:60,height:10,background:C.border}}):fmtVal(v,attrId)
                )),
                selectedYears.length>1&&CE('td',{style:{padding:'4px 10px',textAlign:'right',color:yoy==null?C.muted:yoy>0?C.green:C.red,fontVariantNumeric:'tabular-nums'}},
                  yoy!=null?(yoy>0?'+':'')+yoy.toFixed(3):'—'
                )
              );
            })
          ])
        )
      )
    ),

    // CHART VIEW
    viewMode==='chart'&&CE('div',null,
      CE('div',{style:{background:C.s1,border:'1px solid '+C.border,padding:'12px 8px',marginBottom:8}},
        CE('div',{style:{fontSize:6,color:C.muted,letterSpacing:'1px',marginBottom:8}},
          (PSD_ATTR_MAP[chartAttr]?.n||'').toUpperCase()+' · '+(selectedCountry==='ALL'?'WORLD':PSD_COUNTRY_NAMES[selectedCountry]||selectedCountry)+' · '+(PSD_CROPS[selectedCrops[0]]?.unit||'1000 MT')
        ),
        renderChart()
      ),
      // Data table below chart
      CE('div',{style:{fontSize:6,color:C.muted,letterSpacing:'1px',marginBottom:6}},'UNDERLYING DATA ('+PSD_ATTR_MAP[chartAttr]?.n+')'),
      CE('div',{style:{overflowX:'auto'}},
        CE('table',{style:{width:'100%',borderCollapse:'collapse',fontSize:7,fontFamily:'IBM Plex Mono,monospace'}},
          CE('thead',null,CE('tr',null,
            CE('th',{style:{padding:'4px 8px',textAlign:'left',borderBottom:'1px solid '+C.border,color:C.muted,fontSize:6}},'CROP'),
            selectedYears.map(yr=>CE('th',{key:yr,style:{padding:'4px 10px',textAlign:'right',borderBottom:'1px solid '+C.border,color:C.accent,fontSize:7}},'MY'+yr))
          )),
          CE('tbody',null,
            chartData.map(({crop,vals,color})=>CE('tr',{key:crop,style:{borderBottom:'1px solid '+C.border+'40'}},
              CE('td',{style:{padding:'4px 8px',color:color,fontWeight:600}},crop),
              vals.map((v,i)=>CE('td',{key:i,style:{padding:'4px 10px',textAlign:'right',color:chartAttr===195?suColor(v):C.hi,fontVariantNumeric:'tabular-nums'}},fmtVal(v,chartAttr)))
            ))
          )
        )
      )
    ),

    // Source note
    CE('div',{style:{marginTop:12,fontSize:6,color:C.muted,borderTop:'1px solid '+C.border,paddingTop:8,lineHeight:1.8}},
      'Source: USDA FAS Production, Supply & Distribution (PSD) Online Database · api.fas.usda.gov · Monthly updates · Units per crop: Corn/Soy/Wheat/Sugar/Cocoa/Palm Oil = 1,000 Metric Tons · Cotton = 1,000 480-lb Bales · Coffee = 1,000 60-kg Bags · Stocks/Use = Ending Stocks ÷ Dom. Consumption × 100'
    )
  );
}


function AlphaOS(){
  const [mod,setMod]=useState('BRIEFING');
  const [showSettings,setShowSettings]=useState(false);
  const [showAlerts,setShowAlerts]=useState(false);
  const [detail,setDetail]=useState(null);
  const [apiKeys,setApiKeys]=useState(()=>({fred:localStorage.getItem('aos_fred')||'',eia:localStorage.getItem('aos_eia')||'',usda:localStorage.getItem('aos_usda')||'',polygon:localStorage.getItem('aos_polygon')||'',psd:localStorage.getItem('aos_psd')||'',esr:localStorage.getItem('aos_esr')||'',ams:localStorage.getItem('aos_ams')||'',claude_key:localStorage.getItem('aos_claude_key')||''}));
  const [prices,setPrices]=useState(null);
  const [yields,setYields]=useState(null);
  const [cot,setCot]=useState([]);
  const [noaa,setNoaa]=useState(null);
  const [gdelt,setGdelt]=useState(null);
  const [geo,setGeo]=useState([]);
  const [sc,setSC]=useState([]);
  const [enso,setEnso]=useState(null);
  const [hawk,setHawk]=useState(null);
  const [fred,setFred]=useState(null);
  const [eia,setEia]=useState(null);
  const [usda,setUsda]=useState(null);
  const [cotLoading,setCotLoading]=useState(true);
  const [psd,setPsd]=useState(null);
  const [esr,setEsr]=useState(null);
  const [ams,setAms]=useState(null);
  const [apiStatus,setApiStatus]=useState({cftc:'loading',noaa:'loading',gdelt:'loading',treasury:'loading',enso:'loading',claude:'live',fred:'needs_key',eia:'needs_key',usda:'needs_key',polygon:'needs_key',psd:'needs_key',esr:'needs_key',ams:'needs_key'});

  // Boot: all free APIs in parallel
  useEffect(()=>{
    (async()=>{
      const [pRes,yRes,nRes,gRes,eRes]=await Promise.all([fetchPrices(),fetchYields(),fetchNOAA(),fetchGDELT(),fetchENSO()]);
      setPrices(pRes);setYields(yRes);setNoaa(nRes);setGdelt(gRes);setEnso(eRes);
      setApiStatus(s=>({...s,noaa:nRes.status,gdelt:gRes.status,treasury:yRes.status,enso:eRes.status,polygon:pRes.status==='live'?'live':'needs_key'}));
      // COT sequential (pacing)
      const cotRes=await fetchCOT();setCot(cotRes);setCotLoading(false);
      setApiStatus(s=>({...s,cftc:cotRes.some(c=>c.live)?'live':'error'}));
      // Claude scoring + GDELT derived
      const [hRes,geoRes,scRes]=await Promise.all([fetchHawkishness(apiKeys.claude_key),fetchGeoRisk(),fetchSupplyChain()]);
      setHawk(hRes);setGeo(geoRes);setSC(scRes);
    })();
  },[]);

  // Key-gated APIs
  useEffect(()=>{
    if(apiKeys.fred){setApiStatus(s=>({...s,fred:'loading'}));fetchFRED(apiKeys.fred).then(d=>{if(d){setFred(d);setApiStatus(s=>({...s,fred:'live'}));}else setApiStatus(s=>({...s,fred:'error'}));});}
    if(apiKeys.eia){setApiStatus(s=>({...s,eia:'loading'}));fetchEIA(apiKeys.eia).then(d=>{if(d){setEia(d);setApiStatus(s=>({...s,eia:'live'}));}else setApiStatus(s=>({...s,eia:'error'}));});}
    if(apiKeys.usda){setApiStatus(s=>({...s,usda:'loading'}));fetchUSDA(apiKeys.usda).then(d=>{if(d){setUsda(d);setApiStatus(s=>({...s,usda:'live'}));}else setApiStatus(s=>({...s,usda:'error'}));});}
    if(apiKeys.psd){setApiStatus(s=>({...s,psd:'loading'}));fetchPSDMulti(apiKeys.psd).then(d=>{if(d){setPsd(d);setApiStatus(s=>({...s,psd:'live'}));}else setApiStatus(s=>({...s,psd:'error'}));});}
    if(apiKeys.esr){setApiStatus(s=>({...s,esr:'loading'}));fetchESR(apiKeys.esr).then(d=>{if(d){setEsr(d);setApiStatus(s=>({...s,esr:'live'}));}else setApiStatus(s=>({...s,esr:'error'}));});}
    if(apiKeys.ams){setApiStatus(s=>({...s,ams:'loading'}));fetchAMS(apiKeys.ams).then(d=>{if(d){setAms(d);setApiStatus(s=>({...s,ams:'live'}));}else setApiStatus(s=>({...s,ams:'error'}));});}
  },[apiKeys]);

  const ctx=useMemo(()=>buildCtx({prices,yields,cot,noaa,gdelt,fred,eia,usda,hawk,geo,enso,psd,esr,ams}),[prices,yields,cot,noaa,gdelt,fred,eia,usda,hawk,geo,enso,psd,esr,ams]);

  // Dynamic alerts from live data only
  const alerts=useMemo(()=>{
    const a=[];
    (cot||[]).forEach(c=>{if(!c.live)return;if(c.pct>=80)a.push({s:'HIGH',t:c.label+' COT at '+c.pct+'th %ile — spec longs historically overbought (net: '+fmtK(c.net*1000)+')',src:'CFTC LIVE'});else if(c.pct<=20)a.push({s:'MEDIUM',t:c.label+' COT at '+c.pct+'th %ile — crowded short setup',src:'CFTC LIVE'});});
    if(hawk?.scores){const hs=hawk.scores;const fed=hs.FED?.score||50,ecb=hs.ECB?.score||50;if(Math.abs(fed-ecb)>15)a.push({s:'HIGH',t:'CB Hawkishness divergence: FED '+fed+' vs ECB '+ecb+' (spread '+(fed-ecb>0?'+':'')+(fed-ecb)+'pt)',src:'CLAUDE NLP LIVE'});}
    if(noaa?.count>5)a.push({s:'MEDIUM',t:noaa.count+' active NOAA severe weather alerts across US',src:'NOAA LIVE'});
    (geo||[]).forEach(g=>{if(g.live&&g.ci>65)a.push({s:'HIGH',t:g.r+': GDELT conflict index '+g.ci+'/100 ('+g.n+' articles, avg tone '+g.tone+')',src:'GDELT LIVE'});});
    if(!a.length)a.push({s:'LOW',t:'No high-severity signals from live data feeds',src:'SYSTEM'});
    return a.slice(0,8);
  },[cot,hawk,noaa,geo]);

  // Ticker from live prices only
  const tickers=useMemo(()=>{
    const P=prices?.data||{};
