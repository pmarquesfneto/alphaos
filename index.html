async function fetchCOT(){
  const mkts=[
    {label:'CORN',q:'CORN - CHICAGO BOARD OF TRADE'},
    {label:'SOYBEANS',q:'SOYBEANS - CHICAGO BOARD OF TRADE'},
    {label:'WHEAT',q:'WHEAT-SRW - CHICAGO BOARD OF TRADE'},
    {label:'COTTON',q:'COTTON NO. 2 - ICE FUTURES U.S.'},
    {label:'COFFEE',q:'COFFEE C - ICE FUTURES U.S.'},
    {label:'SUGAR',q:'SUGAR NO. 11 - ICE FUTURES U.S.'},
    {label:'WTI',q:'CRUDE OIL, LIGHT SWEET - CHICAGO MERCANTILE EXCHANGE'},
    {label:'GOLD',q:'GOLD - COMMODITY EXCHANGE INC.'},
    {label:'NAT GAS',q:'NATURAL GAS - NEW YORK MERCANTILE EXCHANGE'},
  ];
  const results=[];
  for(const m of mkts){
    try{
      const commodity=m.q.split(' - ')[0];
      const w=encodeURIComponent(`market_and_exchange_names like '%${commodity}%'`);
      const r=await fetch(`https://publicreporting.cftc.gov/api/id/6dca-aqww.json?$limit=2&$order=report_date_as_yyyy_mm_dd+DESC&$where=${w}`);
      if(!r.ok)throw new Error('err');
      const d=await r.json();
      if(d&&d[0]){
        const rec=d[0];
        const lng=parseInt(rec.noncomm_positions_long_all||0);
        const sht=parseInt(rec.noncomm_positions_short_all||0);
        const oi=parseInt(rec.open_interest_all||0);
        const net=lng-sht;
        const chgL=parseInt(rec.change_in_noncomm_long_all||0);
        const chgS=parseInt(rec.change_in_noncomm_short_all||0);
        results.push({label:m.label,net,lng,sht,oi,chg:chgL-chgS,date:rec.report_date_as_yyyy_mm_dd,live:true});
      } else results.push({label:m.label,net:0,live:false});
    }catch(e){results.push({label:m.label,net:0,live:false});}
  }
  return results;
}

async function fetchNOAA(){
  try{
    const r=await fetch('https://api.weather.gov/alerts/active?status=actual&message_type=alert&urgency=Immediate,Expected&certainty=Observed,Likely&severity=Extreme,Severe',{headers:{'User-Agent':'AlphaOS/3.0 research@alphaos.io'}});
    if(!r.ok)throw new Error('NOAA err');
    const d=await r.json();
    const alerts=(d.features||[]).slice(0,8).map(f=>({
      id:f.id,event:f.properties.event,
      area:f.properties.areaDesc?.split(';')[0],
      severity:f.properties.severity,
      headline:f.properties.headline?.slice(0,90),
      onset:f.properties.onset,
    }));
    return{status:'live',alerts,count:d.features?.length||0};
  }catch(e){return{status:'error',alerts:[],error:e.message};}
}

async function fetchGDELT(){
  try{
    const q=encodeURIComponent('commodity oil wheat corn gold supply chain inflation agriculture');
    const r=await fetch(`https://api.gdeltproject.org/api/v2/doc/doc?query=${q}&mode=ArtList&maxrecords=10&format=json&timespan=24h`);
    if(!r.ok)throw new Error('GDELT err');
    const d=await r.json();
    const articles=(d.articles||[]).slice(0,8).map(a=>({
      title:a.title?.slice(0,80),url:a.url,domain:a.domain,
      tone:parseFloat(a.tone||0).toFixed(1),date:a.seendate,
    }));
    return{status:'live',articles};
  }catch(e){return{status:'error',articles:[],error:e.message};}
}

async function fetchFRED(key){
  if(!key)return null;
  const series=[
    {id:'FEDFUNDS',label:'Fed Funds Rate'},{id:'CPIAUCSL',label:'CPI (YoY)'},
    {id:'UNRATE',label:'Unemployment'},{id:'DGS10',label:'10Y Yield'},
    {id:'DGS2',label:'2Y Yield'},{id:'DTWEXBGS',label:'Trade-Wtd USD'},
    {id:'T10YIE',label:'10Y Breakeven'},{id:'BAMLH0A0HYM2',label:'HY OAS Spread'},
  ];
  const results=[];
  for(const s of series){
    try{
      const r=await fetch(`https://api.stlouisfed.org/fred/series/observations?series_id=${s.id}&api_key=${key}&file_type=json&sort_order=desc&limit=6`);
      if(!r.ok)continue;
      const d=await r.json();
      const obs=(d.observations||[]).filter(o=>o.value!=='.');
      if(obs[0])results.push({id:s.id,label:s.label,value:parseFloat(obs[0].value),prev:parseFloat(obs[1]?.value||obs[0].value),date:obs[0].date,history:obs.slice(0,6).reverse().map(o=>parseFloat(o.value))});
    }catch(e){}
  }
  return results.length?results:null;
}

async function fetchEIA(key){
  if(!key)return null;
  try{
    const r=await fetch(`https://api.eia.gov/v2/petroleum/stoc/wstk/data/?frequency=weekly&data[0]=value&sort[0][column]=period&sort[0][direction]=desc&length=8&api_key=${key}`);
    if(!r.ok)return null;
    const d=await r.json();
    return{status:'live',data:(d.response?.data||[]).slice(0,6),series:'US Crude Oil Stocks'};
  }catch(e){return null;}
}

async function fetchUSDA(key){
  if(!key)return null;
  try{
    const r=await fetch(`https://quickstats.nass.usda.gov/api/api_GET/?key=${key}&commodity_desc=CORN&statisticcat_desc=CONDITION&class_desc=GOOD%20%2B%20EXCELLENT&year__GE=2024&state_name=US%20TOTAL&format=json`);
    if(!r.ok)return null;
    const d=await r.json();
    return{status:'live',data:(d.data||[]).slice(0,6).map(r=>({week:r.week_ending,value:parseFloat(r.Value),year:r.year}))};
  }catch(e){return null;}
}

function Spark({data=[],color=C.accent,w=80,h=24}){
  const vals=data.map(Number).filter(v=>!isNaN(v));
  if(vals.length<2)return React.createElement('div',{style:{width:w,height:h}});
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1))*w},${h-4-((v-mn)/rng)*(h-8)+2}`).join(' ');
  return React.createElement('svg',{width:w,height:h,style:{display:'block'}},React.createElement('polyline',{points:pts,fill:'none',stroke:color,strokeWidth:1.5,strokeLinejoin:'round'}));
}

function CotGauge({pct=50,size=38}){

  return React.createElement('svg',{width:size*2,height:size+6,style:{display:'block',margin:'4px 0'}},
    React.createElement('path',{d:`M ${sx} ${sy} A ${r} ${r} 0 0 1 ${cx+r} ${sy}`,fill:'none',stroke:C.muted,strokeWidth:3,strokeLinecap:'round'}),
    pct>0&&React.createElement('path',{d:`M ${sx} ${sy} A ${r} ${r} 0 ${pct>50?1:0} 1 ${ex} ${ey}`,fill:'none',stroke:clr,strokeWidth:3,strokeLinecap:'round'}),
    React.createElement('text',{x:cx,y:cy+2,textAnchor:'middle',fontSize:11,fill:clr,fontFamily:'IBM Plex Mono,monospace',fontWeight:'bold'},pct+'%')
  );
}
