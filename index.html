/* 1. MARKET PRICES via Yahoo Finance + CORS proxy fallback */
async function fetchPrices(){
  const MAP={'CL=F':{l:'WTI',u:'$/bbl'},'BZ=F':{l:'BRENT',u:'$/bbl'},'GC=F':{l:'GOLD',u:'$/oz'},'HG=F':{l:'COPPER',u:'$/lb'},'ZC=F':{l:'CORN',u:'\u00a2/bu'},'ZS=F':{l:'SOYBEANS',u:'\u00a2/bu'},'ZW=F':{l:'WHEAT',u:'\u00a2/bu'},'KC=F':{l:'COFFEE',u:'\u00a2/lb'},'CC=F':{l:'COCOA',u:'$/mt'},'SB=F':{l:'SUGAR',u:'\u00a2/lb'},'CT=F':{l:'COTTON',u:'\u00a2/lb'},'NG=F':{l:'NAT GAS',u:'$/mmb'},'^GSPC':{l:'S&P 500',u:''},'EURUSD=X':{l:'EUR/USD',u:''},'^VIX':{l:'VIX',u:''},'^TNX':{l:'10Y UST',u:'%'},'DX-Y.NYB':{l:'DXY',u:''}};
  const syms=Object.keys(MAP).join(',');
  const YF_URL='https://query1.finance.yahoo.com/v7/finance/quote?formatted=true&symbols='+syms+'&fields=regularMarketPrice,regularMarketChange,regularMarketChangePercent';
  const PROXIES=[
    'https://corsproxy.io/?'+encodeURIComponent(YF_URL),
    'https://api.allorigins.win/raw?url='+encodeURIComponent(YF_URL),
  ];
  for(const url of PROXIES){
    try{
      const r=await fetch(url,{headers:{Accept:'application/json'}});
      if(!r.ok)continue;
      const d=await r.json();
      const quotes=d.quoteResponse?.result||[];
      if(!quotes.length)continue;
      const data={};
      quotes.forEach(q=>{const m=MAP[q.symbol];if(m&&q.regularMarketPrice?.raw!=null)data[m.l]={price:q.regularMarketPrice.raw,chg:q.regularMarketChange?.raw,pct:q.regularMarketChangePercent?.raw,unit:m.u};});
      if(Object.keys(data).length>5)return{status:'live',src:'Yahoo Finance',data};
    }catch(e){}
  }
  return{status:'needs_key',src:'Yahoo Finance — CORS blocked',data:{},note:'Connect Polygon.io ($29/mo) for direct live prices'};
}

/* 2. US TREASURY YIELDS — free, no key */
async function fetchYields(){
  try{
    const yr=new Date().getFullYear();
    const r=await fetch('https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/'+yr+'/all?type=daily_treasury_yield_curve&field_tdrv_date_value_year='+yr+'&download=true');
    if(!r.ok)throw new Error(r.status);
    const csv=await r.text();const lines=csv.trim().split('\n').filter(l=>l.trim());
    if(lines.length<2)throw new Error('no data');
    const hdrs=lines[0].split(',').map(h=>h.replace(/"/g,'').trim());
    const last=lines[lines.length-1].split(',').map(v=>v.replace(/"/g,'').trim());
    const row={};hdrs.forEach((h,i)=>{row[h]=last[i];});
    const g=(...ks)=>{for(const k of ks){const v=parseFloat(row[k]);if(!isNaN(v))return v;}return null;};
    return{status:'live',src:'US Treasury',date:row['Date']||last[0],
      '1M':g('1 Mo'),'3M':g('3 Mo'),'6M':g('6 Mo'),'1Y':g('1 Yr'),
      '2Y':g('2 Yr'),'5Y':g('5 Yr'),'10Y':g('10 Yr'),'20Y':g('20 Yr'),'30Y':g('30 Yr')};
  }catch(e){return{status:'error',src:'US Treasury',error:e.message};}
}

/* 3. CFTC COT with real 52-week percentile */
async function fetchCOTMarket(label,query){
  try{
    const w=encodeURIComponent("market_and_exchange_names like '%"+query+"%'");
    const r=await fetch('https://publicreporting.cftc.gov/api/id/6dca-aqww.json?$limit=52&$order=report_date_as_yyyy_mm_dd+DESC&$where='+w);
    if(!r.ok)throw new Error(r.status);
    const data=await r.json();if(!data||!data.length)throw new Error('no data');
    const rows=data.map(rec=>{const lng=parseInt(rec.noncomm_positions_long_all||0),sht=parseInt(rec.noncomm_positions_short_all||0);return{net:lng-sht,lng,sht,oi:parseInt(rec.open_interest_all||0),chgL:parseInt(rec.change_in_noncomm_long_all||0),chgS:parseInt(rec.change_in_noncomm_short_all||0),date:rec.report_date_as_yyyy_mm_dd};});
    const cur=rows[0];const allN=rows.map(n=>n.net);const mn=Math.min(...allN),mx=Math.max(...allN),rng=mx-mn||1;
    return{label,net:cur.net,lng:cur.lng,sht:cur.sht,oi:cur.oi,chg:cur.chgL-cur.chgS,date:cur.date,pct:Math.round(((cur.net-mn)/rng)*100),min52:mn,max52:mx,weeks:rows.length,live:true};
  }catch(e){return{label,net:0,pct:50,live:false,error:e.message};}
}
async function fetchCOT(){
  const mkts=[{l:'CORN',q:'CORN - CHICAGO BOARD'},{l:'SOYBEANS',q:'SOYBEANS - CHICAGO BOARD'},{l:'WHEAT',q:'WHEAT-SRW'},{l:'COTTON',q:'COTTON NO. 2'},{l:'COFFEE',q:'COFFEE C'},{l:'SUGAR',q:'SUGAR NO. 11'},{l:'WTI',q:'CRUDE OIL, LIGHT SWEET'},{l:'GOLD',q:'GOLD - COMMODITY EXCHANGE'},{l:'NAT GAS',q:'NATURAL GAS - NEW YORK'}];
  const results=[];for(const m of mkts){results.push(await fetchCOTMarket(m.l,m.q));await new Promise(r=>setTimeout(r,150));}
  return results;
}

async function fetchNOAA(){

  }catch(e){return{status:'error',src:'NOAA',alerts:[],error:e.message};}

/* 5. ENSO / ONI Index — NOAA CPC via CORS proxy */
async function fetchENSO(){
  const URLS=[
    'https://corsproxy.io/?'+encodeURIComponent('https://www.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt'),
    'https://api.allorigins.win/raw?url='+encodeURIComponent('https://origin.cpc.ncep.noaa.gov/data/indices/oni.ascii.txt'),
  ];
  for(const url of URLS){
    try{
      const r=await fetch(url);if(!r.ok)continue;
      const text=await r.text();
      const lines=text.trim().split('\n').filter(l=>l.trim()&&!/^\s*SEAS/.test(l)&&!/^\s*YR/.test(l));
      if(!lines.length)continue;
      const parse=l=>{const p=l.trim().split(/\s+/);return{seas:p[0],yr:parseInt(p[1]),anom:parseFloat(p[4])};};
      const recent=lines.slice(-4).map(parse).filter(d=>!isNaN(d.anom));
      if(!recent.length)continue;
      const lat=recent[recent.length-1];
      const phase=lat.anom>=0.5?'EL NINO':lat.anom<=-0.5?'LA NINA':'NEUTRAL';
      const trend=recent.length>1?(lat.anom>recent[recent.length-2].anom?'+':'-'):'→';
      const implication=phase==='LA NINA'?'Brazil/SEA drought risk elevated · Corn & Soy watch':phase==='EL NINO'?'MENA + Australia dry risk · Wheat & Sugar watch':'Normal seasonal pattern · Monitor transition';
      return{status:'live',oni:lat.anom,phase,trend,seas:lat.seas,yr:lat.yr,recent:recent.slice(-3),implication,src:'NOAA CPC'};
    }catch(e){}
  }
  return{status:'error',oni:null,phase:'UNKNOWN',src:'NOAA CPC'};
}

/* 6. GDELT Regional Risk — derived from live article sentiment */
async function fetchGeoRisk(){
  const regions=[{n:'MENA',q:'middle east oil OPEC iran conflict'},{n:'E.EUROPE',q:'ukraine russia black sea wheat'},{n:'SE ASIA',q:'southeast asia china trade supply'},{n:'W.AFRICA',q:'west africa cocoa ghana nigeria'}];
  const out=[];
  for(const reg of regions){
    try{
      const r=await fetch('https://api.gdeltproject.org/api/v2/doc/doc?query='+encodeURIComponent(reg.q)+'&mode=ArtList&maxrecords=10&format=json&timespan=7d');
      const d=await r.json();const arts=d.articles||[];
      const avg=arts.length?arts.reduce((s,a)=>s+parseFloat(a.tone||0),0)/arts.length:0;
      out.push({r:reg.n,ci:Math.min(100,Math.max(0,Math.round(50-avg*4))),ei:Math.min(100,Math.max(0,Math.round(50+avg*3))),n:arts.length,tone:avg.toFixed(1),live:true});
      await new Promise(r=>setTimeout(r,300));
    }catch(e){out.push({r:reg.n,ci:50,ei:50,live:false});}
  }
  return out;
}

  try{

      model:'claude-sonnet-4-20250514',max_tokens:300,

/* 9. FRED — key-gated */
async function fetchFRED(key){
  if(!key)return null;
  const series=[{id:'FEDFUNDS',l:'Fed Funds'},{id:'CPIAUCSL',l:'CPI YoY'},{id:'UNRATE',l:'Unemployment'},{id:'DGS2',l:'2Y Yield'},{id:'DGS10',l:'10Y Yield'},{id:'T10Y2Y',l:'2s10s Spread'},{id:'T10YIE',l:'10Y Breakeven'},{id:'BAMLH0A0HYM2',l:'HY Spread'}];
  const out=[];
  for(const s of series){
    try{
      const r=await fetch('https://api.stlouisfed.org/fred/series/observations?series_id='+s.id+'&api_key='+key+'&file_type=json&sort_order=desc&limit=8');
      if(!r.ok)continue;const d=await r.json();
      const obs=(d.observations||[]).filter(o=>o.value!=='.');
      if(obs[0])out.push({id:s.id,label:s.l,value:parseFloat(obs[0].value),prev:parseFloat(obs[1]?.value||obs[0].value),date:obs[0].date,hist:obs.slice(0,8).reverse().map(o=>parseFloat(o.value))});
    }catch(e){}
  }
  return out.length?{status:'live',src:'FRED',data:out}:null;
}

function buildCtx(st){
  const {prices,yields,cot,noaa,gdelt,fred,eia,usda,hawk,geo,enso}=st;
  const P=prices?.data||{},Y=yields||{};
  const ps=Object.entries(P).slice(0,10).map(([k,v])=>k+':'+fmt(v.price)+'('+fmtPct(v.pct)+')').join(' ');
  const cs=(cot||[]).filter(c=>c.live).map(c=>c.label+' '+c.pct+'th%ile '+fmtK(c.net)).join(' ');
  const hs=Object.entries(hawk?.scores||{}).map(([k,v])=>k+'='+v.score+'('+v.change+')').join(' ');
  const fs=(fred?.data||[]).map(s=>s.label+':'+fmt(s.value)+'%').join(' ');
  const gs=(geo||[]).map(g=>g.r+':conflict='+g.ci).join(' ');
  const yStr=Y['2Y']&&Y['10Y']?'US2Y:'+fmt(Y['2Y'],2)+'% 10Y:'+fmt(Y['10Y'],2)+'% spread:'+fmt((Y['10Y']-Y['2Y'])*100,0)+'bp':'';
  const ensoStr=enso?.status==='live'?'ONI:'+enso.oni+' '+enso.phase+' ('+enso.implication+')':'';
  return 'You are AlphaQuery — institutional hedge fund AI. Date: '+new Date().toDateString()+'.\n\nLIVE PRICES ('+prices?.src+'): '+(ps||'OFFLINE')+
    '\nLIVE COT (CFTC 52w real percentiles): '+(cs||'loading')+
    '\nLIVE YIELDS (US Treasury): '+(yStr||'loading')+
    '\nLIVE CB HAWKISHNESS (Claude NLP): '+(hs||'loading')+
    (ensoStr?'\nLIVE ENSO (NOAA CPC): '+ensoStr:'')+
    (fs?'\nFRED MACRO: '+fs:'\nFRED: key not configured')+
    (eia?'\nEIA CRUDE: '+fmt(eia.latest/1000,1)+'Mb ('+fmtK(eia.chg*1000)+' WoW)':'')+
    (usda?'\nUSDA CORN G/E: '+usda.data[0]?.value?.toFixed(0)+'%':'')+
    '\nGDELT GEO RISK: '+(gs||'loading')+
    '\n\nOnly cite data present above. Be concise (4-6 sentences), data-driven, action-oriented. No disclaimers.';
}

function MacroModule({prices,yields,fred,hawk}){
  const P=prices?.data||{},Y=yields||{},fd=fred?.data||[];
  const spread2=fd.find(s=>s.id==='T10Y2Y');
  let rlabel='AWAITING DATA',rcol=C.muted;
  const sp2y10=Y['2Y']&&Y['10Y']?(Y['10Y']-Y['2Y'])*100:spread2?(spread2.value*100):null;
  if(sp2y10!=null){if(sp2y10<-30){rlabel='STAGFLATION RISK';rcol=C.red;}else if(sp2y10<0){rlabel='LATE CYCLE';rcol=C.gold;}else{rlabel='EXPANSION';rcol=C.green;}}
  const HS=hawk?.scores||{};
